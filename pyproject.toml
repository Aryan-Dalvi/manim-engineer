[project]
name = "manim-engineer"
version = "0.1.0"
description = "Turn talks, slides, papers and audio into verified Manim animations for presenters."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "manim>=0.19.1,<0.20",
    "pydantic>=2.7",
    "numpy>=1.26",
    "click>=8.1",
    "rich>=13",
    "jinja2>=3.1",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "webvtt-py>=0.5",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1"]
youtube = ["yt-dlp>=2025.1", "youtube-transcript-api>=1.0"]
anthropic = ["anthropic>=0.40"]
slides = ["manim-slides>=5.5,<6"]
all = [
    "faster-whisper>=1.1",
    "yt-dlp>=2025.1",
    "youtube-transcript-api>=1.0",
    "anthropic>=0.40",
    "manim-slides>=5.5,<6",
]

[project.scripts]
manim-engineer = "manim_engineer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: renders with Manim or ffmpeg; slower",
    "live_llm: talks to a real LLM backend; opt-in",
]
addopts = "-m 'not live_llm'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/manim_engineer/kit/*" = ["F403", "F405"]
"src/manim_engineer/kit/__init__.py" = ["F401", "F403", "F405"]
"tests/fixtures/scenes/*" = ["F403", "F405"]
